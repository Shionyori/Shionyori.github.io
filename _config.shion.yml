# ============================================
# Blog-specific overrides for hexo-theme-shion
# Hexo merges this file on top of themes/shion/_config.yml
# ============================================

# --- Home Page ---
home:
  sticky_badge: false

# --- Site Identity ---
# --- Sidebar ---
sidebar:
  avatar:
    image: /images/avatar.png
  social:
    GitHub: https://github.com/Shionyori
  widgets:  # 全局默认（所有页面未单独配置时使用）
    - recent-posts
    - categories-widget
    - tags-widget
  layouts:
    # index: 主页，未设置时使用全局默认
    archive:
      widgets: []
    friends:
      widgets: []
    tags:
      widgets: []
    categories:
      widgets: []
    about:
      widgets: []

# --- Footer ---
footer:
  since: 2025

