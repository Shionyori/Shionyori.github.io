# --- Comments ---
# Waline first: deploy a Waline server, then set serverURL below and enable.
#   https://waline.js.org/guide/get-started/
comments:
  enable: false
  type: waline
  lazy: true
  waline:
    serverURL: '' # e.g. https://waline.example.com
    lang: auto

# --- Hero Waves ---
# The wave band that closes the hero on non-post pages (home / archive /
# tag / category / page) and doubles as the divider above the content.
# Tune the look here; see the theme default _config.yml for every key.
waves:
  enable: true
  # hero_height: min(60svh, 800px) # banner height (number = rem)
  # height: clamp(3.125rem, 15svh, 9.375rem) # water band height
  amplitude: 0.64 # wave depth, fraction of the band height (0.2 – 0.71)
  layers: 4 # stacked waves (2 – 8)
  depth_falloff: 0.45 # how much shallower the waves behind the shore are (1 = all equal)
  speed: 1
  opacity: 1
  opacity_back: 0.2 # opacity of the furthest wave
  # color: null # water colour, defaults to the page background
  # shore_color: null # page colour the waves melt into, defaults to --color-bg-alt
